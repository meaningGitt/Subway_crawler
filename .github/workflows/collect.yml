name: Missing subway data collection
on:
  # Former 09:00/22:00 KST schedule remains retired pending explicit restoration.
  workflow_dispatch:
    inputs:
      retry_failed:
        description: '직전 실행에서 실패한 출처만 재시도'
        default: false
        type: boolean
permissions:
  contents: write
  actions: read
concurrency:
  group: subway-production-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/checkout@v4
        with:
          ref: collection-data
          path: state
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements-analysis.txt
      - run: python -m pip install -r app/requirements-analysis.txt
      - name: Collect missing data and validate
        id: collect
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          RETRY_FAILED: ${{ inputs.retry_failed }}
        run: python scripts/missing_actions_run.py
      - name: Persist only new supplement state
        if: ${{ always() && steps.collect.outcome != 'skipped' }}
        working-directory: state
        run: |
          test -f missing-data/baseline.json
          if [ -f missing-data/collection.sqlite ]; then
            python -c "import sqlite3; c=sqlite3.connect('missing-data/collection.sqlite'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); assert c.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'; c.close()"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f missing-data
          git reset --quiet -- 'missing-data/.collection.lock' 'missing-data/collection.sqlite-shm' 'missing-data/collection.sqlite-wal'
          if ! git diff --cached --quiet; then
            git commit -m "data: missing supplements ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            git push origin HEAD:collection-data
          fi
      - name: Publish CSV reports and new data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: missing-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            state/missing-data/new
            state/missing-data/reports
            state/missing-data/derived
            state/missing-data/quarantine
            state/missing-data/collection.sqlite
          retention-days: 90
          if-no-files-found: warn
