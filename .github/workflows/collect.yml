name: Metropolitan subway collection
on:
  schedule:
    # KST = UTC+9. UTC 00:00/13:00 => Asia/Seoul 09:00/22:00 every day.
    - cron: '0 0 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      retry_run:
        description: '실패한 수집 run ID (빈 값이면 전체 출처)'
        required: false
        type: string
      force:
        description: '메타데이터가 같아도 원본 재검증'
        default: false
        type: boolean
permissions:
  contents: write
  actions: read
# One state writer, for both manual and scheduled runs. Do not cancel an active transaction.
concurrency:
  group: subway-production-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/checkout@v4
        with:
          ref: collection-data
          path: state
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: python -m pip install -r app/requirements.txt
      - name: Collect and validate
        id: collect
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_RUN: ${{ inputs.retry_run }}
          FORCE_REFRESH: ${{ inputs.force }}
          SCHEDULE: ${{ github.event.schedule }}
        run: python scripts/actions_run.py
      - name: Check recommendation source updates
        if: ${{ always() && steps.collect.outcome != 'skipped' }}
        working-directory: app
        run: python scripts/recommendation_check.py
      - name: Persist cumulative state even after source failures
        if: ${{ always() && steps.collect.outcome != 'skipped' }}
        working-directory: state
        run: |
          if [ ! -d runtime ]; then exit 1; fi
          if [ -f runtime/collection.sqlite ]; then
            python -c "import sqlite3; c=sqlite3.connect('runtime/collection.sqlite'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); assert c.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'; c.close()"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f runtime
          git reset --quiet -- 'runtime/.collection.lock' 'runtime/collection.sqlite-shm' 'runtime/collection.sqlite-wal' || true
          if ! git diff --cached --quiet; then
            git commit -m "data: collection ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            git push origin HEAD:collection-data
          fi
      - name: Publish run reports and recovery snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            state/runtime/reports
            state/runtime/exports
            state/runtime/collection.sqlite
            state/runtime/collection.log*
            state/runtime/recommendation-metadata/runs
          retention-days: 90
          if-no-files-found: warn
