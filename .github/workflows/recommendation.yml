name: Recommendation data collection and analysis
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: subway-recommendation-analysis
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: collection-data
          path: baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - run: python -m pip install -r requirements-analysis.txt
      - name: Collect official files and generate evidence
        run: python -m subway_crawler.recommendation run --root "$RUNNER_TEMP/seat-data" --inventory baseline/runtime/exports/kric_station_inventory.csv
      - name: Publish data and diagnostics outside Git
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/seat-data
          retention-days: 14
          if-no-files-found: warn
      - name: Explain storage limits
        if: always()
        run: |
          echo '공식 데이터 수집·분석 결과는 이번 실행 artifact에 14일 보관됩니다. 영구 저장소가 아니며, 전체 정기 수집은 영구 저장소 설정 전 자동 활성화하지 않습니다. 기존 09:00/22:00 KST 워크플로는 메타데이터 갱신을 확인합니다.' >> "$GITHUB_STEP_SUMMARY"
